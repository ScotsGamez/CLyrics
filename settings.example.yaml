# ========================================================
# Transparent Live Lyrics Overlay - User Settings Example (YAML)
# Copy this to settings.yaml or let the app generate it automatically.
# ========================================================

# --- Window Geometry ---
pos_x: 100
pos_y: 100
width: 960
height: 220

# --- Behavior & Layout ---
is_locked: false  # When true, mouse clicks pass directly through to games and apps
theme: "Minimalist"  # Options: "Minimalist", "Cyberpunk", "Sunset", "Emerald"
album_cover_mode: "off"  # Options: "off", "left", "right"
sync_offset: 0.0  # Timing offset in seconds (e.g. +0.5 earlier, -0.5 later)

# --- Typography ---
font_family: "Segoe UI"
active_font_size: 22
context_font_size: 15
